<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spud Rush</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- The look of the page around the game. Not the game itself. -->
<link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- The game is drawn entirely inside this one square. -->
  <canvas id="game" width="1000" height="1000"></canvas>

  <!-- If you change the keys in js/config.js, change this line to match. -->
  <p class="hint">
    Player 1: <b>W A S D</b> to walk, <b>E</b> to use
    &nbsp;·&nbsp; Player 2: <b>8 4 5 6</b> to walk, <b>7</b> to use
    (number pad or top row)
    <br>
    Each player uses whatever is glowing in their colour
    &nbsp;·&nbsp; <b>R</b> to start again &nbsp;·&nbsp; <b>M</b> to mute
  </p>

  <!--
    The three script files, in the order they must load.

      config.js  —  every number and word in the game. Edit this one.
      sound.js   —  makes all the beeps and the tune. No sound files needed.
      game.js    —  the rules and the drawing. Edit this one less often.

    config.js MUST come first, because the other two read its settings.
  -->
  <script src="js/config.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>

</body>
</html>
