<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPUD RUSH: KITCHEN WARS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="stage">
    <!-- The game draws itself onto this rectangle -->
    <canvas id="game" width="900" height="600"></canvas>
    <p class="hint">
      <span class="p1">P1</span> W A S D to move &middot; 1 🧊 2 🧈 to sabotage
      &nbsp;&nbsp;|&nbsp;&nbsp;
      <span class="p2">P2</span> Arrow keys to move &middot; 7 🧊 8 🧈 to sabotage
      &nbsp;&nbsp;|&nbsp;&nbsp;
      M = mute
    </p>
  </main>

  <!-- Load order matters: settings first, then sound, then engine, then the rules -->
  <script src="js/config.js" charset="utf-8"></script>
  <script src="js/sound.js" charset="utf-8"></script>
  <script src="js/engine.js" charset="utf-8"></script>
  <script src="js/game.js" charset="utf-8"></script>
</body>
</html>
